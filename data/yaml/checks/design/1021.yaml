id: '1021'
sortKey: 103900
severity: major
target: design
platform:
- web
- mobile
check:
  ja: |-
    制限時間が設定されているフォームがない、または、フォーム入力中に制限時間が超過しても、それまでの入力内容を失うことなく入力を再開できるようになっている。
  en: |-
    There are no forms with a set time limit, or if the time limit is exceeded while entering information into a form, it is possible to resume input without losing the content entered up to that point.
conditions:
- platform: general
  type: or
  conditions:
  - type: simple
    tool: misc
    id: "1021-misc-01"
    procedure:
      ja: |-
        制限時間が設定されているフォームがない。
      en: |-
        There are no forms with a set time limit.
  - type: simple
    tool: misc
    id: "1021-misc-02"
    procedure:
      ja: |-
        制限時間が設定されているフォームの入力中に制限時間が超過した場合、それまでの入力内容を失うことなく入力を再開できるようになっている。
      en: |-
        If the time limit is exceeded while entering information into a form with a set time limit, it is possible to resume input without losing the content entered up to that point.
