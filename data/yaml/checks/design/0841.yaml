id: '0841'
sortKey: 103600
severity: normal
target: design
platform:
- web
- mobile
check:
  ja: |-
    そのページ/画面のサイトやアプリケーション内での位置が、サイトやアプリケーション内でのナビゲーションを担うコンポーネント（グローバル・ナビゲーションやパンくずリストなど）内で示されている。
  en: |-
    The position of the page/screen within the site or application is indicated within the components responsible for navigation within the site or application, such as global navigation or breadcrumb lists.
conditions:
- platform: web
  type: or
  conditions:
  - type: simple
    id: 0841-content-00
    tool: misc
    procedure:
      ja: |-
        チェック対象の画面が、以下のいずれかに該当する。

        *  モーダル・ダイアログである
        *  ウィザードなど、特定の手順に沿ってのみ表示される画面である
        *  エラーページなど、例外的な場合にのみ表示され、現在地の表示が不可能な画面である
      en: |-
        The screen to be checked meets one of the following conditions:

        *  It is a modal dialog.
        *  It is a screen displayed only in a specific procedure, such as a wizard.
        *  It is a screen displayed only in exceptional cases, such as an error page, where indicating the current location is not possible.
  - type: simple
    id: 0841-content-01
    tool: misc
    procedure:
      ja: |-
        そのページ/画面の、サイトやアプリケーション内での位置が視覚的に分かるような表示が、サイトやアプリケーション内でのナビゲーションを担うコンポーネントによって示されている。
      en: |-
        A visual indication of the position of the page/screen within the site or application is provided by the components responsible for navigation within the site or application.
