id: '0771'
sortKey: 501300
severity: normal
target: product
platform:
- web
- mobile
check:
  ja: |-
    画面の向きを変更しても使用できる。
  en: |-
    The content is usable regardless of screen orientation.
conditions:
- platform: general
  type: or
  conditions:
  - type: simple
    tool: misc
    id: "0771-misc-01"
    procedure:
      ja: |-
        画面方向を検知できる端末（おもにモバイル端末・タブレット端末）を想定した専用の機能や専用の見た目を提供していない。
      en: |-
        No features or visual designs specifically intended for devices that can detect screen orientation (mainly mobile and tablet devices) are provided.
  - type: simple
    tool: misc
    id: "0771-misc-02"
    procedure:
      ja: |-
        画面方向を検知できる端末において、端末の方向を変えると適切に画面が回転し、機能の利用に問題がないことを確認する。
      en: |-
        On devices that can detect screen orientation, verify that the screen rotates appropriately when the device orientation is changed and that there are no problems using the features.
