id: '0521'
sortKey: 200700
severity: major
target: code
platform:
- web
- mobile
check:
  ja: |-
    画像化されたテキストと同じ内容が、スクリーン・リーダーで確認できる形のテキスト・データとしても提供されている。
  en: |-
    The same content as images of text is also provided as text data in a form that can be recognized by screen readers.
implementations:
- title:
    ja: テキスト・データの提供
    en: Providing Text Data
  methods:
  - platform: web
    method:
      ja: |-
        *  ``img`` 要素の場合は、 ``alt`` 属性を用いる
        *  ``img`` 要素以外の要素で画像を表現している場合は、 ``role="img"`` を付加した上で、 ``aria-label`` 属性を用いる
      en: |-
        *  For the ``img`` element, use the ``alt`` attribute.
        *  For elements other than the ``img`` element that represent images, add ``role="img"`` and use the ``aria-label`` attribute.
  - platform: ios
    method:
      ja: |-
        *  ``accessibilityLabel`` を用いる
      en: |-
        *  Use the ``accessibilityLabel``
  - platform: android
    method:
      ja: |-
        *  ``contentDescription`` を用いる
      en: |-
        *  Use the ``contentDescription``
