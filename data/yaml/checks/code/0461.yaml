id: '0461'
sortKey: 200600
severity: normal
target: code
platform:
- web
- mobile
check:
  ja: |-
    情報や機能性を一切持たない画像は、スクリーン・リーダーで無視されるようになっている。
  en: |-
    Images that have no information or functionality are ignored by screen readers.
implementations:
- title:
    ja: スクリーン・リーダーに無視させる
    en: Make It Ignored by Screen Readers
  methods:
  - platform: web
    method:
      ja: |-
        *  ``img`` 要素の場合は、空の ``alt`` 属性（ ``alt=""`` ）を指定、または
        *  ``img`` 要素以外の要素で画像を表現している場合は、 ``role="none"`` または ``role="presentation"`` を指定、または
        *  CSSで背景画像として指定
      en: |-
        *  For ``img`` elements, specify an empty ``alt`` attribute ( ``alt=""`` ). Or
        *  For non-``img`` elements representing images, specify ``role="none"`` or ``role="presentation"``. Or
        *  Specify as a background image in CSS.
  - platform: ios
    method:
      ja: |-
        *  ``isAccessibilityElement`` を ``false`` にする。
      en: |-
        *  Set ``isAccessibilityElement`` to ``false``.
  - platform: android
    method:
      ja: |-
        *  ``importantForAccessibility`` を ``no`` にする。
      en: |-
        *  Set ``importantForAccessibility`` to ``no``.
