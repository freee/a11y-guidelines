id: '0941'
sortKey: 202100
severity: major
target: code
platform:
- web
- mobile
check:
  ja: |-
    エディット・ボックス、チェックボックス、ラジオボタンなど、フォーム・コントロールにはその役割が分かるラベルが付けられている。
  en: |-
    Form controls such as edit boxes, check boxes, and radio buttons have labels that indicate their purposes.
implementations:
- title:
    ja: フォーム・コントロールのラベル付け
    en: Labeling Form Controls
  methods:
  - platform: web
    method:
      ja: |-
        *  ラベルとして表示されているテキストまたは画像が存在する場合、 ``label`` 要素を用いてフォーム・コントロールと関連付ける
        *  ``label`` 要素を使用できない場合に限り、 ``aria-labelledby`` 属性を用いて、表示されているテキストまたは画像と関連付ける
        *  ラベルとして表示されているものが存在しない、または ``label`` 要素と ``aria-labelledby`` 属性のいずれも使用できない場合に限り、 ``aria-label`` 属性でラベルを指定する
      en: |-
        *  When there is displayed text or an image serving as a label, associate it with the form control using the ``label`` element.
        *  Only when the ``label`` element cannot be used, associate the displayed text or image with the form control using the ``aria-labelledby`` attribute.
        *  Only when no displayed label exists, or when neither the ``label`` element nor the ``aria-labelledby`` attribute can be used, specify the label with the ``aria-label`` attribute.
  - platform: ios
    method:
      ja: |-
        *  ``accessibilityLabel`` を用いる。
      en: |-
        *  Use ``accessibilityLabel``.
  - platform: android
    method:
      ja: |-
        *  ``labelFor`` を用いる。
      en: |-
        *  Use ``labelFor``.
- title:
    ja: 適切な状態の確認
    en: Checking for Appropriate States
  methods:
  - platform: web
    method:
      ja: |-
        *  開発者ツールで確認するとフォーム・コントロールのaccessible nameに役割が分かるテキストが指定されている状態
      en: |-
        *  When checked with developer tools, the accessible name of the form control specifies text that indicates its purpose.
